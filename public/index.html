<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Art or Not?</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Art or Not?</h1>
        <p class="subtitle">Can you tell real art from everyday objects?</p>
        
        <div class="submit-prominent">
            <a href="/submit.html" class="submit-button">Submit an Image</a>
        </div>
        
        <div id="game-area">
            <div class="image-container">
                <img id="current-image" src="" alt="Mystery Image">
            </div>
            
            <div class="button-container">
                <button class="vote-btn art-btn" data-vote="art">
                    <span class="icon">🎨</span>
                    <span class="text">Art</span>
                </button>
                <button class="vote-btn trash-btn" data-vote="trash">
                    <span class="icon">❌</span>
                    <span class="text">Not Art</span>
                </button>
            </div>
            
            <div class="navigation-container">
                <button id="back-btn" class="nav-btn" disabled>
                    <span class="icon">←</span>
                    <span class="text">Back</span>
                </button>
            </div>
            
            <div id="result" class="result hidden"></div>
            <button id="next-btn" class="next-btn hidden">Next Image</button>
        </div>
        
        <div id="stats" class="stats">
            <h3>Global Stats</h3>
            <div id="stats-content"></div>
        </div>
        
        <div class="footer-links">
            <details class="help-section">
                <summary>Help & Info</summary>
                <div class="help-content">
                    <h4>How to Play</h4>
                    <p>Look at each image and decide: Is it art from a museum, or just an everyday object?</p>
                    
                    <h4>Keyboard Shortcuts</h4>
                    <div class="shortcuts-grid">
                        <span class="key">1</span><span>Vote Art</span>
                        <span class="key">2</span><span>Vote Not Art</span>
                        <span class="key">Space/Enter</span><span>Next Image</span>
                        <span class="key">← / Backspace</span><span>Previous Image</span>
                    </div>
                </div>
            </details>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
